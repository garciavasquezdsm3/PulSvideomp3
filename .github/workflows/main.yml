name: Build Android APK
 
on:
  push:
    branches: [ main ]
  workflow_dispatch:
 
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Evita que el token de GitHub se guarde en .git/config
          persist-credentials: false
 
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
 
      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
 
      - name: Install Flet
        run: |
          python -m pip install --upgrade pip
          pip install flet
 
      # Las dependencias que van DENTRO del APK salen de requirements.txt.
      # flet build las empaqueta solo; no hay que instalarlas con pip -t .
      - name: Build APK with Flet
        run: |
          flet build apk --yes --exclude .git .github
 
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PulSvideomp3-APK-Instalable
          path: build/apk/*.apk
